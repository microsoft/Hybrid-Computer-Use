name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    outputs:
      go-version: ${{ steps.build.outputs.go-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check that the tag matches VERSION
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Build static binary
        id: build
        run: |
          make build-local
          echo "go-version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      # One binary with a fixed owner, time and mode, so equal binaries give
      # byte-identical archives.
      - name: Package
        run: |
          mkdir -p artifacts/release
          tar --format=gnu --owner=0 --group=0 --numeric-owner --mtime=@0 --mode=0775 \
            -C artifacts -cf - computer-use \
            | gzip -9n > "artifacts/release/computer-use-$(cat VERSION)-linux-amd64.tar.gz"
      - name: MCP contract smoke from the archive (no desktop input)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf artifacts/release/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          python3 scripts/smoke-mcp.py "$RUNNER_TEMP/unpacked/computer-use"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: artifacts/release/
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Build native package
        run: make build-macos
      - name: Package
        run: |
          mkdir -p artifacts/release
          tar -czf "artifacts/release/computer-use-$(cat VERSION)-macos-$(go env GOARCH).tar.gz" \
            -C artifacts/macos .
      - name: MCP contract smoke from the archive (no desktop input)
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf artifacts/release/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          python3 scripts/smoke-mcp.py "$RUNNER_TEMP/unpacked/computer-use"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: artifacts/release/
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build native package
        shell: pwsh
        run: ./computer-use/native/windows/build.ps1 -OutputDirectory "$PWD/artifacts/windows"
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          [void](New-Item -ItemType Directory -Force -Path artifacts/release)
          Compress-Archive -Path artifacts/windows/* `
            -DestinationPath "artifacts/release/computer-use-$version-windows-amd64.zip"
      - name: MCP contract smoke from the archive (no desktop input)
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts/release/*.zip -DestinationPath "$env:RUNNER_TEMP/unpacked"
          python scripts/smoke-mcp.py "$env:RUNNER_TEMP/unpacked/computer-use.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: artifacts/release/
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GO_VERSION: ${{ needs.linux.outputs.go-version }}
        run: |
          linux="release/computer-use-${GITHUB_REF_NAME#v}-linux-amd64.tar.gz"
          {
            printf '%s\n\n' 'Linux, macOS and Windows builds of `computer-use`. The Linux archive holds the single static binary. The macOS and Windows archives hold `computer-use`, its native provider and the license notices; keep them in one folder.'
            for archive in release/*; do
              printf 'SHA-256 of `%s`: `%s`\n\n' "${archive#release/}" "$(sha256sum "$archive" | cut -d' ' -f1)"
            done
            printf 'SHA-256 of the unpacked Linux `computer-use` binary: `%s`\n\n' \
              "$(tar -xzOf "$linux" computer-use | sha256sum | cut -d' ' -f1)"
            printf 'Built from this tag with %s by `.github/workflows/release.yml`: Linux with `make build-local`, macOS with `make build-macos` and Windows with `computer-use/native/windows/build.ps1`. See CHANGELOG.md for changes.\n' \
              "$GO_VERSION"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
