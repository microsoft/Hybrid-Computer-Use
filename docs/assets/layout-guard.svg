<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d"><title id="t">How the layout guard stops a misclick</title><desc id="d">Schematic. After a GUI screenshot, an AX action closes a side panel and the toolbar shifts, so a click planned on Save would land on Delete. HCU detects the changed layout, sends nothing, and returns a fresh screenshot; the corrected click lands on Save.</desc><style>
text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #242424; }
.title { font-size: 17px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #616161; }
.wt { font-size: 11.5px; fill: #707070; }
.fmt { font-size: 12px; fill: #9a9a9a; font-weight: 600; }
.btn { font-size: 12px; font-weight: 600; }
.ph { font-size: 12px; font-weight: 600; fill: #424242; }
.ref { font: 600 11px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; fill: #fff; }
.tag { font-size: 12px; font-weight: 600; fill: #fff; }
.log { font: 12.5px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
.ch { font-size: 11.5px; font-weight: 700; }
.st { font-size: 14px; font-weight: 600; }
.sd { font-size: 12px; fill: #616161; }
.num { font-size: 12px; font-weight: 700; }
.a { animation-duration: 12.0s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; transform-box: view-box; }
@keyframes shift { 0.000% { transform: none } 30.833% { transform: none } 36.667% { transform: translateX(72.80000000000001px) } 96.667% { transform: translateX(72.80000000000001px) } 100.000% { transform: none } }
@keyframes page { 0.000% { transform: none } 30.833% { transform: none } 36.667% { transform: translateX(67.60000000000001px) } 96.667% { transform: translateX(67.60000000000001px) } 100.000% { transform: none } }
@keyframes panel { 0.000% { transform: none; opacity: 1 } 30.833% { transform: none; opacity: 1 } 36.667% { transform: translateX(145.60000000000002px); opacity: 0 } 96.667% { transform: translateX(145.60000000000002px); opacity: 0 } 100.000% { transform: none; opacity: 1 } }
@keyframes aim { 0.000% { transform: none } 75.000% { transform: none } 80.833% { transform: translateX(72.80000000000001px) } 96.667% { transform: translateX(72.80000000000001px) } 100.000% { transform: none } }
@keyframes aim-plan { 0.000% { opacity: 1 } 48.333% { opacity: 1 } 50.000% { opacity: 0 } 98.333% { opacity: 0 } 100.000% { opacity: 1 } }
@keyframes aim-stale { 0.000% { opacity: 0 } 50.000% { opacity: 0 } 52.083% { opacity: 1 } 72.917% { opacity: 1 } 75.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes aim-ok { 0.000% { opacity: 0 } 75.000% { opacity: 0 } 77.083% { opacity: 1 } 97.083% { opacity: 1 } 99.167% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes tag { 0.000% { opacity: 0 } 51.667% { opacity: 0 } 53.750% { opacity: 1 } 72.917% { opacity: 1 } 75.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes del-hot { 0.000% { opacity: 0 } 50.000% { opacity: 0 } 52.083% { opacity: 1 } 72.917% { opacity: 1 } 75.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes save-hot { 0.000% { opacity: 0 } 80.833% { opacity: 0 } 82.917% { opacity: 1 } 97.083% { opacity: 1 } 99.167% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes toast { 0.000% { opacity: 0 } 85.833% { opacity: 0 } 87.917% { opacity: 1 } 97.083% { opacity: 1 } 99.167% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes close-hot { 0.000% { opacity: 0 } 25.000% { opacity: 0 } 26.250% { opacity: 1 } 31.250% { opacity: 1 } 32.500% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes flash { 0.000% { opacity: 0 } 1.250% { opacity: 0.85 } 4.167% { opacity: 0 } 50.000% { opacity: 0 } 51.250% { opacity: 0.85 } 54.167% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes shake { 0.000% { transform: none } 51.250% { transform: none } 52.083% { transform: translateX(-4px) } 52.917% { transform: translateX(4px) } 53.750% { transform: translateX(-3px) } 54.583% { transform: none } 100.000% { transform: none } }
@keyframes step0 { 0.000% { opacity: 1 } 23.333% { opacity: 1 } 25.000% { opacity: 0 } 98.333% { opacity: 0 } 100.000% { opacity: 1 } }
@keyframes dim0 { 0.000% { opacity: 1 } 0.000% { opacity: 1 } 1.667% { opacity: 1 } 23.333% { opacity: 1 } 25.000% { opacity: 0.45 } 98.333% { opacity: 0.45 } 100.000% { opacity: 1 } }
@keyframes step1 { 0.000% { opacity: 0 } 25.000% { opacity: 0 } 26.667% { opacity: 1 } 48.333% { opacity: 1 } 50.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes dim1 { 0.000% { opacity: 0.45 } 24.992% { opacity: 0.45 } 26.667% { opacity: 1 } 48.333% { opacity: 1 } 50.000% { opacity: 0.45 } 98.333% { opacity: 0.45 } 100.000% { opacity: 0.45 } }
@keyframes step2 { 0.000% { opacity: 0 } 50.000% { opacity: 0 } 51.667% { opacity: 1 } 73.333% { opacity: 1 } 75.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes dim2 { 0.000% { opacity: 0.45 } 49.992% { opacity: 0.45 } 51.667% { opacity: 1 } 73.333% { opacity: 1 } 75.000% { opacity: 0.45 } 98.333% { opacity: 0.45 } 100.000% { opacity: 0.45 } }
@keyframes step3 { 0.000% { opacity: 0 } 75.000% { opacity: 0 } 76.667% { opacity: 1 } 98.333% { opacity: 1 } 100.000% { opacity: 0 } 100.000% { opacity: 0 } }
@keyframes dim3 { 0.000% { opacity: 0.45 } 74.992% { opacity: 0.45 } 76.667% { opacity: 1 } 98.333% { opacity: 1 } 100.000% { opacity: 0.45 } 98.333% { opacity: 0.45 } 100.000% { opacity: 0.45 } }
@media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
</style><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2fb"/><stop offset="1" stop-color="#f4f6f9"/></linearGradient></defs><rect x="0.5" y="0.5" width="899" height="379" rx="14" fill="#ffffff" stroke="#e0e0e0"/><rect x="14" y="56" width="548" height="310" rx="10" fill="url(#bg)"/><text x="28" y="32" class="title">How the layout guard stops a misclick<tspan class="subtitle" dx="12" font-weight="400">Schematic</tspan></text>
<g>
  <rect x="28" y="70" width="520" height="250" rx="8" fill="#fff" filter="url(#sh)"/>
  <text x="40" y="87" class="wt">report.docx · Editor</text>
  <g fill="none" stroke="#b3b3b3" stroke-width="1.4"><rect x="486" y="79" width="9" height="9" rx="2"/><rect x="504" y="79" width="9" height="9" rx="2"/><rect x="522" y="79" width="9" height="9" rx="2"/></g>
  <rect x="28" y="96" width="520" height="40" fill="#fafafa"/>
  <line x1="28" x2="548" y1="96" y2="96" stroke="#e0e0e0"/>
  <line x1="28" x2="548" y1="136" y2="136" stroke="#e0e0e0"/>
  <text x="44" y="121.0" class="fmt">B   I   U</text>
  <clipPath id="body"><rect x="28" y="136.5" width="520" height="183.5" rx="0"/></clipPath>
  <g clip-path="url(#body)">
    <rect x="28" y="136" width="520" height="184" fill="#f3f3f3"/>
    <g class="a" style="animation-name: page"><rect x="59.2" y="150" width="322.4" height="250" fill="#fff" stroke="#e6e6e6"/><rect x="89.2" y="168" width="236.2" height="6" rx="3" fill="#e3e3e3"/><rect x="89.2" y="184" width="236.2" height="6" rx="3" fill="#e3e3e3"/><rect x="89.2" y="200" width="157.4" height="6" rx="3" fill="#e3e3e3"/><rect x="89.2" y="216" width="236.2" height="6" rx="3" fill="#e3e3e3"/><rect x="89.2" y="232" width="236.2" height="6" rx="3" fill="#e3e3e3"/><rect x="89.2" y="248" width="157.4" height="6" rx="3" fill="#e3e3e3"/></g>
    <g class="a" style="animation-name: panel">
      <rect x="402.4" y="136" width="145.6" height="250" fill="#fff" stroke="#e0e0e0"/>
      <text x="414.4" y="158" class="ph">Comments</text>
      <rect class="a" style="animation-name: close-hot" x="518" y="145" width="18" height="18" rx="4" fill="#0f6cbd" opacity="0"/>
      <text x="527" y="158" text-anchor="middle" class="ph" fill="#707070">×</text>
      <g class="a" style="animation-name: close-hot" opacity="0"><rect x="482" y="145" width="28" height="18" rx="3" fill="#0f6cbd"/><text x="496" y="158" text-anchor="middle" class="ref">r8</text></g>
      <rect x="414.4" y="172" width="121.6" height="26" rx="6" fill="#ebf3fc"/><rect x="414.4" y="206" width="121.6" height="26" rx="6" fill="#ebf3fc"/><rect x="414.4" y="240" width="121.6" height="26" rx="6" fill="#ebf3fc"/>
    </g>
  </g>
  <g class="a" style="animation-name: shift">
    <rect x="144.8" y="103.0" width="68" height="26" rx="5" fill="#fff" stroke="#d1d1d1"/><path d="M1 2.5h12M4 2.5V1h6v1.5M2.5 2.5l.7 10h7.6l.7-10" transform="translate(153.8 109.0)" fill="none" stroke="#a4262c" stroke-width="1.4" stroke-linejoin="round"/><text x="184.8" y="120.5" class="btn" fill="#a4262c" text-anchor="middle">Delete</text>
    <rect class="a" style="animation-name: del-hot" opacity="0" x="144.8" y="103.0" width="68" height="26" rx="5" fill="rgba(197,15,31,0.08)" stroke="#c50f1f" stroke-width="1.6"/>
    <rect x="217.6" y="103.0" width="68" height="26" rx="5" fill="#fff" stroke="#d1d1d1"/><path d="M1 1h9l3 3v9H1zM3.5 1v3.5h6V1M3 13V8.5h8V13" transform="translate(226.6 109.0)" fill="none" stroke="#0f6cbd" stroke-width="1.4" stroke-linejoin="round"/><text x="257.6" y="120.5" class="btn" fill="#0f6cbd" text-anchor="middle">Save</text>
    <rect class="a" style="animation-name: save-hot" opacity="0" x="217.6" y="103.0" width="68" height="26" rx="5" fill="rgba(15,108,189,0.10)" stroke="#0f6cbd" stroke-width="1.6"/>
  </g>
  <g class="a" style="animation-name: aim"><g class="a" style="animation-name: shake">
    <g class="a" style="animation-name: aim-plan"><circle cx="251.6" cy="116.0" r="16" fill="none" stroke="#bc4b09" stroke-width="2" stroke-dasharray="4 3"/><circle cx="251.6" cy="116.0" r="2.5" fill="#bc4b09"/></g>
    <g class="a" style="animation-name: aim-stale" opacity="0"><circle cx="251.6" cy="116.0" r="16" fill="none" stroke="#c50f1f" stroke-width="2.4"/><circle cx="251.6" cy="116.0" r="2.5" fill="#c50f1f"/></g>
    <g class="a" style="animation-name: aim-ok" opacity="0"><circle cx="251.6" cy="116.0" r="16" fill="none" stroke="#107c10" stroke-width="2.4"/><circle cx="251.6" cy="116.0" r="2.5" fill="#107c10"/></g>
  </g></g>
  <g class="a" style="animation-name: tag" opacity="0"><path d="M246.6 142.0 l5 -5 l5 5z" fill="#c50f1f"/><rect x="159.6" y="142.0" width="184" height="24" rx="4" fill="#c50f1f"/><text x="251.6" y="158.0" text-anchor="middle" class="tag">Old point is now on Delete</text></g>
  <g class="a" style="animation-name: toast" opacity="0"><rect x="466" y="282" width="66" height="24" rx="6" fill="#107c10"/><text x="499" y="298" text-anchor="middle" class="tag">Saved</text></g>
  <rect class="a" style="animation-name: flash" opacity="0" x="28" y="70" width="520" height="250" rx="8" fill="#fff"/>
</g><text class="a log" style="animation-name: step0" opacity="1" x="28" y="350" fill="#424242">GUI screenshot → layout recorded</text><text class="a log" style="animation-name: step1" opacity="0" x="28" y="350" fill="#424242">AX click r8 → panel closed</text><text class="a log" style="animation-name: step2" opacity="0" x="28" y="350" fill="#c50f1f">GUI click(430, 92) → stale layout, 0 sent</text><text class="a log" style="animation-name: step3" opacity="0" x="28" y="350" fill="#107c10">GUI click(570, 92) → 1 of 1 sent</text><g class="a" style="animation-name: dim0"><rect class="a" style="animation-name: step0" opacity="1" x="576" y="72" width="296" height="62" rx="6" fill="#f5f5f5"/><circle cx="596" cy="91" r="11" fill="#fff" stroke="#bc4b09" stroke-width="2"/><text x="596" y="95" text-anchor="middle" class="num" fill="#bc4b09">1</text><text x="624" y="86" class="ch" fill="#bc4b09">GUI</text><text x="624" y="103" class="st">Screenshot</text><text x="624" y="120" class="sd">The model plans a click on Save.</text></g><g class="a" style="animation-name: dim1"><rect class="a" style="animation-name: step1" opacity="0" x="576" y="138" width="296" height="62" rx="6" fill="#f5f5f5"/><circle cx="596" cy="157" r="11" fill="#fff" stroke="#0f6cbd" stroke-width="2"/><text x="596" y="161" text-anchor="middle" class="num" fill="#0f6cbd">2</text><text x="624" y="152" class="ch" fill="#0f6cbd">AX</text><text x="624" y="169" class="st">AX closes the panel</text><text x="624" y="186" class="sd">The toolbar shifts right, and Delete</text><text x="624" y="201" class="sd">now sits under the planned point.</text></g><g class="a" style="animation-name: dim2"><rect class="a" style="animation-name: step2" opacity="0" x="576" y="204" width="296" height="62" rx="6" fill="#f5f5f5"/><circle cx="596" cy="223" r="11" fill="#fff" stroke="#c50f1f" stroke-width="2"/><text x="596" y="227" text-anchor="middle" class="num" fill="#c50f1f">3</text><text x="624" y="218" class="ch" fill="#c50f1f">Guard</text><text x="624" y="235" class="st">Stale click blocked</text><text x="624" y="252" class="sd">The layout changed, so HCU sends</text><text x="624" y="267" class="sd">nothing and returns a fresh screenshot.</text></g><g class="a" style="animation-name: dim3"><rect class="a" style="animation-name: step3" opacity="0" x="576" y="270" width="296" height="62" rx="6" fill="#f5f5f5"/><circle cx="596" cy="289" r="11" fill="#fff" stroke="#107c10" stroke-width="2"/><text x="596" y="293" text-anchor="middle" class="num" fill="#107c10">4</text><text x="624" y="284" class="ch" fill="#107c10">GUI</text><text x="624" y="301" class="st">Corrected click</text><text x="624" y="318" class="sd">The model clicks Save at its new position.</text></g></svg>
