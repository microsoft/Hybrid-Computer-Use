<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t"><title id="t">One AX call: observe a compact tree, send one batch of steps, guard each step against the live tree, and read back a diff.</title><rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="#ffffff" stroke="#e0e0e0"/><style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #242424; } .h { font-size: 17px; font-weight: 700; } .hs { font-size: 13px; fill: #616161; } .row { font-size: 11.5px; font-weight: 700; fill: #8a8a8a; letter-spacing: 0.06em; } .bt { font-size: 14px; font-weight: 600; } .bl { font-size: 12px; fill: #616161; } .bm { font: 11px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; fill: #424242; } .al { font-size: 11.5px; fill: #616161; } .core { font-size: 14px; font-weight: 700; } .tag { font: 600 11.5px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; }</style><text x="28" y="36" class="h">One AX call, from tree to diff</text><text x="28" y="57" class="hs">Chrome site settings: the model reads a compact tree, sends one batch, and gets back only what changed.</text><rect x="28.0" y="78" width="200.5" height="226" rx="10" fill="#ffffff" stroke="#e0e0e0"/><rect x="28.0" y="78" width="200.5" height="4" rx="2" fill="#0f6cbd"/><text x="42.0" y="106" class="bt" fill="#0f6cbd">1  Observe</text><rect x="40.0" y="120" width="176.5" height="120" rx="6" fill="#fafafa" stroke="#ececec"/><text x="50.0" y="144" class="bm" xml:space="preserve">w1   window &quot;Site settings&quot;</text><text x="50.0" y="168" class="bm" xml:space="preserve">r15  textbox &quot;Search&quot;</text><text x="50.0" y="192" class="bm" xml:space="preserve">r37  link &quot;Location&quot;</text><text x="50.0" y="216" class="bm" xml:space="preserve">r38  link &quot;Camera&quot;</text><text x="42.0" y="272" class="bl">73 lines instead of 169 nodes</text><path d="M231.5 186 l6 5 l-6 5" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><rect x="242.5" y="78" width="200.5" height="226" rx="10" fill="#ffffff" stroke="#e0e0e0"/><rect x="242.5" y="78" width="200.5" height="4" rx="2" fill="#0f6cbd"/><text x="256.5" y="106" class="bt" fill="#0f6cbd">2  Send one batch</text><rect x="254.5" y="120" width="176.5" height="120" rx="6" fill="#fafafa" stroke="#ececec"/><text x="264.5" y="144" class="bm" xml:space="preserve">click     r15</text><text x="264.5" y="168" class="bm" xml:space="preserve">type      r15 &quot;camera&quot;</text><text x="264.5" y="192" class="bm" xml:space="preserve">keypress  ENTER</text><text x="264.5" y="216" class="bm" xml:space="preserve">wait      settle</text><text x="256.5" y="272" class="bl">four steps, one model turn</text><path d="M446.0 186 l6 5 l-6 5" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><rect x="457.0" y="78" width="200.5" height="226" rx="10" fill="#ffffff" stroke="#e0e0e0"/><rect x="457.0" y="78" width="200.5" height="4" rx="2" fill="#c50f1f"/><text x="471.0" y="106" class="bt" fill="#c50f1f">3  Guard each step</text><rect x="469.0" y="120" width="176.5" height="120" rx="6" fill="#fafafa" stroke="#ececec"/><text x="479.0" y="144" class="bm" xml:space="preserve">r15 in w1     ok</text><text x="479.0" y="168" class="bm" xml:space="preserve">click type    sent</text><text x="479.0" y="192" class="bm" xml:space="preserve">keypress      sent</text><text x="479.0" y="216" class="bm" xml:space="preserve">settle        quiet</text><text x="471.0" y="272" class="bl">live target checked before input</text><path d="M660.5 186 l6 5 l-6 5" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><rect x="671.5" y="78" width="200.5" height="226" rx="10" fill="#ffffff" stroke="#e0e0e0"/><rect x="671.5" y="78" width="200.5" height="4" rx="2" fill="#107c10"/><text x="685.5" y="106" class="bt" fill="#107c10">4  Read the diff</text><rect x="683.5" y="120" width="176.5" height="120" rx="6" fill="#fafafa" stroke="#ececec"/><text x="693.5" y="144" class="bm" xml:space="preserve">ok   4 of 4 steps</text><text x="693.5" y="168" class="bm" xml:space="preserve">r15  &quot;&quot; -&gt; &quot;camera&quot;</text><text x="693.5" y="192" class="bm" xml:space="preserve">-    link &quot;Location&quot;</text><text x="693.5" y="216" class="bm" xml:space="preserve">~    link &quot;Camera&quot; r38</text><text x="685.5" y="272" class="bl">only the change comes back</text></svg>
