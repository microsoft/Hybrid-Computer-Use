<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t"><title id="t">HCU architecture: coding agents, shell scripts, and Python code call one Go core (contract, AX engine, GUI engine, guards), which drives native providers for Linux, macOS, and Windows.</title><rect x="0.5" y="0.5" width="899" height="559" rx="14" fill="#ffffff" stroke="#e0e0e0"/><style>text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: #242424; } .h { font-size: 17px; font-weight: 700; } .hs { font-size: 13px; fill: #616161; } .row { font-size: 11.5px; font-weight: 700; fill: #8a8a8a; letter-spacing: 0.06em; } .bt { font-size: 14px; font-weight: 600; } .bl { font-size: 12px; fill: #616161; } .bm { font: 11px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; fill: #424242; } .al { font-size: 11.5px; fill: #616161; } .core { font-size: 14px; font-weight: 700; } .tag { font: 600 11.5px 'Cascadia Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; }</style><text x="28" y="36" class="h">One Go core, three native providers</text><text x="28" y="57" class="hs">Agents, scripts, and Python code reach the same contract; each OS keeps its own accessibility and input APIs.</text><text x="28" y="96" class="row">CALLERS</text><rect x="28" y="106" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="42" y="132" class="bt" fill="#242424">Coding agents</text><text x="42" y="152" class="bl">Codex, Claude Code, Gemini CLI,</text><text x="42" y="169" class="bl">Grok Build · MCP over stdio</text><rect x="314" y="106" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="328" y="132" class="bt" fill="#242424">Shell scripts</text><text x="328" y="152" class="bm">computer-use click r12</text><text x="328" y="169" class="bm">--wait &#x27;{&quot;window&quot;:&quot;Save&quot;}&#x27;</text><rect x="600" y="106" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="614" y="132" class="bt" fill="#242424">Python code</text><text x="614" y="152" class="bm">import hcu_sdk as hcu</text><text x="614" y="169" class="bm">d.find(...) · d.click(...)</text><line x1="164.0" x2="164.0" y1="190" y2="230" stroke="#9e9e9e" stroke-width="1.6"/><path d="M159.0 229 L164.0 236 L169.0 229" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><text x="174.0" y="217.0" class="al">in process</text><line x1="450.0" x2="450.0" y1="190" y2="230" stroke="#9e9e9e" stroke-width="1.6"/><path d="M445.0 229 L450.0 236 L455.0 229" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><text x="460.0" y="217.0" class="al">one daemon per desktop</text><line x1="736.0" x2="736.0" y1="190" y2="230" stroke="#9e9e9e" stroke-width="1.6"/><path d="M731.0 229 L736.0 236 L741.0 229" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><text x="746.0" y="217.0" class="al">local socket</text><rect x="20" y="236" width="860" height="154" rx="12" fill="#f5f8fc" stroke="#b4d6fa"/><text x="36" y="262" class="core">computer-use</text><text x="148" y="262" class="hs">MCP tools AX and GUI · one contract, one session state</text><rect x="36.0" y="278" width="198.0" height="96" rx="8" fill="#ffffff" stroke="#616161" stroke-width="1.4"/><rect x="36.0" y="278" width="198.0" height="4" rx="2" fill="#616161"/><text x="50.0" y="304" class="bt" fill="#242424">Contract</text><text x="50.0" y="324" class="bl">Mode-specific schemas,</text><text x="50.0" y="341" class="bl">typed errors, limits</text><rect x="246.0" y="278" width="198.0" height="96" rx="8" fill="#ffffff" stroke="#0f6cbd" stroke-width="1.4"/><rect x="246.0" y="278" width="198.0" height="4" rx="2" fill="#0f6cbd"/><text x="260.0" y="304" class="bt" fill="#0f6cbd">AX engine</text><text x="260.0" y="324" class="bl">Refs aN → wN → rN, batches</text><text x="260.0" y="341" class="bl">of up to 64 steps, diffs</text><rect x="456.0" y="278" width="198.0" height="96" rx="8" fill="#ffffff" stroke="#bc4b09" stroke-width="1.4"/><rect x="456.0" y="278" width="198.0" height="4" rx="2" fill="#bc4b09"/><text x="470.0" y="304" class="bt" fill="#bc4b09">GUI engine</text><text x="470.0" y="324" class="bl">Full-desktop screenshots,</text><text x="470.0" y="341" class="bl">zoom, pointer and keys</text><rect x="666.0" y="278" width="198.0" height="96" rx="8" fill="#ffffff" stroke="#c50f1f" stroke-width="1.4"/><rect x="666.0" y="278" width="198.0" height="4" rx="2" fill="#c50f1f"/><text x="680.0" y="304" class="bt" fill="#c50f1f">Guards</text><text x="680.0" y="324" class="bl">Target check before AX,</text><text x="680.0" y="341" class="bl">layout check before GUI</text><line x1="450.0" x2="450.0" y1="390" y2="426" stroke="#9e9e9e" stroke-width="1.6"/><path d="M445.0 425 L450.0 432 L455.0 425" fill="none" stroke="#9e9e9e" stroke-width="1.6"/><text x="460.0" y="415.0" class="al">versioned provider protocol</text><text x="28" y="426" class="row">PROVIDERS</text><rect x="28" y="436" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="42" y="462" class="bt" fill="#242424">Linux</text><text x="42" y="482" class="bl">Python · AT-SPI2, X11, XTest</text><text x="42" y="499" class="bl">Embedded in the binary</text><rect x="314" y="436" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="328" y="462" class="bt" fill="#242424">macOS 14+</text><text x="328" y="482" class="bl">Swift · AXUIElement,</text><text x="328" y="499" class="bl">CoreGraphics, ScreenCaptureKit</text><rect x="600" y="436" width="272" height="84" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="614" y="462" class="bt" fill="#242424">Windows 10/11</text><text x="614" y="482" class="bl">C# .NET 8 · FlaUI UIA3,</text><text x="614" y="499" class="bl">Win32 input</text><text x="450.0" y="544" text-anchor="middle" class="hs">Apps and windows on the agent's own desktop</text></svg>
